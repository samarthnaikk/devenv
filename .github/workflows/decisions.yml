name: Decisions

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  replay:
    # Offline regression gate for the decision layer. Uses the heuristic
    # provider only: no API key, no network.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Replay decision baselines
        run: python -m core.runtime.decisions_cli replay
